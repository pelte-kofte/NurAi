<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NurAi Legal</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #fbf6f2;
        color: #2b2725;
      }
      main {
        width: min(680px, calc(100vw - 32px));
        background: #fdf9f6;
        border: 1px solid #ede6e1;
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        color: #7a746f;
      }
      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a {
        color: #1f8a8a;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NurAi Legal Pages</h1>
      <p>Use the links below to view our legal documents.</p>
      <nav>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms of Use</a>
      </nav>
    </main>
  </body>
</html>
