name: nurai
description: A calm, mobile-first Islamic app for Quran reading and reflection.
publish_to: 'none'
version: 1.0.1+41

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.2.2
  flutter_qiblah: ^3.1.0+1
  geolocator: ^14.0.0
  adhan: ^2.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  device_info_plus: ^10.1.2
  in_app_review: ^2.0.9
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FBF6F2"
  image: assets/splash/splash.png
  ios: false
  android: true
  web: false
  fullscreen: true

  android_12:
    color: "#FBF6F2"
    image: assets/splash/splash.png
    icon_background_color: "#FBF6F2"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/splash/
    - assets/images/ornaments/
    - assets/quran/final/quran_ar_tr.json
    - assets/quran/meta/surahs.json
    - assets/quran/meta/juz_ranges.json
    - assets/content/hadith_tr.json
    - assets/content/hadith_en.json
    - assets/content/hadith_ar.json
    - assets/content/hadith_de.json
    - assets/content/daily_words_tr.json
    - assets/content/daily_words_en.json
    - assets/content/daily_words_ar.json
    - assets/content/daily_words_de.json
    - assets/content/quotes_tr.json
    - assets/content/quotes_en.json
    - assets/content/quran_en.json
    - assets/content/quran_tr_meal.json
    - assets/adhan/cities.json
    - assets/adhan/
    - assets/ramadan/
    - assets/content/
    - assets/cities/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
