name: nurai
description: A calm, mobile-first Islamic app for Quran reading and reflection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_qiblah: ^3.1.0+1
  geolocator: ^14.0.0
  adhan: ^2.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true

  assets:
    - assets/quran/final/quran_ar_tr.json
    - assets/quran/meta/surahs.json
    - assets/quran/meta/juz_ranges.json

  fonts:
  - family: Amiri
    fonts:
      - asset: assets/fonts/Amiri-Regular.ttf
      - asset: assets/fonts/Amiri-Bold.ttf
        weight: 700

  - family: Merriweather
    fonts:
      - asset: assets/fonts/Merriweather.ttf

  - family: Inter
    fonts:
      - asset: assets/fonts/Inter.ttf

flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true

